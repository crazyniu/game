name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Enforce single current game naming
        run: |
          python3 ci/check_current_game_names.py --self-test
          python3 ci/check_current_game_names.py
      - name: Check scripts and data syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 -c "import json,glob; [json.load(open(p)) for p in glob.glob('PerchSort/levels/*.json') + glob.glob('PerchSort/layout/*.json')]"
      - name: Install Godot
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT_RELEASE: 4.7.2-stable
        run: |
          build="Godot_v${GODOT_RELEASE}_linux.x86_64"
          gh release download "$GODOT_RELEASE" --repo godotengine/godot-builds --pattern "$build.zip" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$build.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/$build" >> "$GITHUB_ENV"
      - name: Smoke and core tests
        run: bash scripts/run_tests.sh
      - name: Validate Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=''
