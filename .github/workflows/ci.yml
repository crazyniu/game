name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PerchSort/package-lock.json
      - name: Install TypeScript test tools
        run: npm --prefix PerchSort ci --no-audit --no-fund
      - name: Check shell and level-data syntax
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          python3 -c "import json,pathlib; [json.loads(p.read_text()) for folder in ('levels','layout') for p in pathlib.Path('PerchSort/assets/resources',folder).glob('*.json')]"
      - name: Check names, painted words, core types, and every stored solution
        run: bash scripts/run_tests.sh
      - name: Record engine validation boundary
        run: echo 'This runner has no Cocos Creator installation. Creator compilation, browser play, visual acceptance, motion, and audio are not verified by this job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=''
